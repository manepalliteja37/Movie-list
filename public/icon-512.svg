<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#F4F7FB" />
      <stop offset="100%" stop-color="#E5ECF4" />
    </linearGradient>
    <linearGradient id="neonBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#00C4EF" />
    </linearGradient>
    <linearGradient id="playYellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE033" />
      <stop offset="100%" stop-color="#F5B301" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#00E5FF" flood-opacity="0.65" />
    </filter>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.12" />
    </filter>
    <filter id="playShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#D97706" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Squircle App Icon Base -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" stroke="#E2E8F0" stroke-width="3" filter="url(#cardShadow)" />

  <!-- Inner Soft Bevel Highlight -->
  <rect x="22" y="22" width="468" height="468" rx="102" fill="none" stroke="#FFFFFF" stroke-width="2.5" opacity="0.9" />

  <!-- Film Reel Strip in Light Neon Blue with Glow -->
  <g filter="url(#neonGlow)">
    <!-- Main Outer Film Strip Body -->
    <!-- Film strip width: 200, height: 350. Centered at (256, 256) -> x: 156, y: 81 -->
    <rect x="156" y="81" width="200" height="350" rx="16" fill="url(#neonBlue)" />

    <!-- Center Film Window / Frame Cutout (Light Background inside) -->
    <rect x="194" y="156" width="124" height="200" rx="14" fill="#F8FAFC" stroke="url(#neonBlue)" stroke-width="4" />

    <!-- Left Sprocket Perforations (Cutouts showing light background) -->
    <g fill="#F8FAFC">
      <rect x="166" y="99" width="16" height="20" rx="4" />
      <rect x="166" y="131" width="16" height="20" rx="4" />
      <rect x="166" y="163" width="16" height="20" rx="4" />
      <rect x="166" y="195" width="16" height="20" rx="4" />
      <rect x="166" y="227" width="16" height="20" rx="4" />
      <rect x="166" y="259" width="16" height="20" rx="4" />
      <rect x="166" y="291" width="16" height="20" rx="4" />
      <rect x="166" y="323" width="16" height="20" rx="4" />
      <rect x="166" y="355" width="16" height="20" rx="4" />
      <rect x="166" y="387" width="16" height="20" rx="4" />
    </g>

    <!-- Right Sprocket Perforations (Cutouts showing light background) -->
    <g fill="#F8FAFC">
      <rect x="330" y="99" width="16" height="20" rx="4" />
      <rect x="330" y="131" width="16" height="20" rx="4" />
      <rect x="330" y="163" width="16" height="20" rx="4" />
      <rect x="330" y="195" width="16" height="20" rx="4" />
      <rect x="330" y="227" width="16" height="20" rx="4" />
      <rect x="330" y="259" width="16" height="20" rx="4" />
      <rect x="330" y="291" width="16" height="20" rx="4" />
      <rect x="330" y="323" width="16" height="20" rx="4" />
      <rect x="330" y="355" width="16" height="20" rx="4" />
      <rect x="330" y="387" width="16" height="20" rx="4" />
    </g>
  </g>

  <!-- Yellow Play Button Triangle in Center Window -->
  <g filter="url(#playShadow)">
    <path
      d="M 234 208 C 234 202.8 239.6 199.5 244.2 202.2 L 298.6 249.2 C 302.8 252.6 302.8 259.4 298.6 262.8 L 244.2 309.8 C 239.6 312.5 234 309.2 234 304 Z"
      fill="url(#playYellow)"
    />
  </g>
</svg>
