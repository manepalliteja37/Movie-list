<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGradMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#F4F7FB" />
      <stop offset="100%" stop-color="#E5ECF4" />
    </linearGradient>
    <linearGradient id="neonBlueMask" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#00C4EF" />
    </linearGradient>
    <linearGradient id="playYellowMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE033" />
      <stop offset="100%" stop-color="#F5B301" />
    </linearGradient>
    <filter id="neonGlowMask" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#00E5FF" flood-opacity="0.65" />
    </filter>
    <filter id="playShadowMask" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#D97706" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Maskable full canvas background -->
  <rect width="512" height="512" fill="url(#bgGradMask)" />

  <!-- Safe zone center elements (scale within 380px) -->
  <g filter="url(#neonGlowMask)">
    <!-- Film Reel Strip in Light Neon Blue with Glow -->
    <rect x="166" y="96" width="180" height="320" rx="16" fill="url(#neonBlueMask)" />
    <!-- Center Film Window Cutout -->
    <rect x="202" y="166" width="108" height="180" rx="14" fill="#F8FAFC" stroke="url(#neonBlueMask)" stroke-width="4" />

    <!-- Left Sprocket Holes -->
    <g fill="#F8FAFC">
      <rect x="175" y="112" width="14" height="18" rx="3.5" />
      <rect x="175" y="142" width="14" height="18" rx="3.5" />
      <rect x="175" y="172" width="14" height="18" rx="3.5" />
      <rect x="175" y="202" width="14" height="18" rx="3.5" />
      <rect x="175" y="232" width="14" height="18" rx="3.5" />
      <rect x="175" y="262" width="14" height="18" rx="3.5" />
      <rect x="175" y="292" width="14" height="18" rx="3.5" />
      <rect x="175" y="322" width="14" height="18" rx="3.5" />
      <rect x="175" y="352" width="14" height="18" rx="3.5" />
      <rect x="175" y="382" width="14" height="18" rx="3.5" />
    </g>

    <!-- Right Sprocket Holes -->
    <g fill="#F8FAFC">
      <rect x="323" y="112" width="14" height="18" rx="3.5" />
      <rect x="323" y="142" width="14" height="18" rx="3.5" />
      <rect x="323" y="172" width="14" height="18" rx="3.5" />
      <rect x="323" y="202" width="14" height="18" rx="3.5" />
      <rect x="323" y="232" width="14" height="18" rx="3.5" />
      <rect x="323" y="262" width="14" height="18" rx="3.5" />
      <rect x="323" y="292" width="14" height="18" rx="3.5" />
      <rect x="323" y="322" width="14" height="18" rx="3.5" />
      <rect x="323" y="352" width="14" height="18" rx="3.5" />
      <rect x="323" y="382" width="14" height="18" rx="3.5" />
    </g>
  </g>

  <!-- Yellow Play Button Triangle -->
  <g filter="url(#playShadowMask)">
    <path
      d="M 238 212 C 238 207 243.5 204 247.8 206.5 L 294.2 249.5 C 298.2 252.8 298.2 259.2 294.2 262.5 L 247.8 305.5 C 243.5 308 238 305 238 300 Z"
      fill="url(#playYellowMask)"
    />
  </g>
</svg>
