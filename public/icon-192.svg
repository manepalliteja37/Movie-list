<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bgGrad192" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#F4F7FB" />
      <stop offset="100%" stop-color="#E5ECF4" />
    </linearGradient>
    <linearGradient id="neonBlue192" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#00C4EF" />
    </linearGradient>
    <linearGradient id="playYellow192" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE033" />
      <stop offset="100%" stop-color="#F5B301" />
    </linearGradient>
    <filter id="neonGlow192" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#00E5FF" flood-opacity="0.65" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="6" y="6" width="180" height="180" rx="40" fill="url(#bgGrad192)" stroke="#E2E8F0" stroke-width="1.5" />
  <rect x="8" y="8" width="176" height="176" rx="38" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.9" />

  <!-- Neon Blue Reel Strip -->
  <g filter="url(#neonGlow192)">
    <rect x="58" y="30" width="76" height="132" rx="7" fill="url(#neonBlue192)" />
    <!-- Center Cutout -->
    <rect x="73" y="58" width="46" height="76" rx="6" fill="#F8FAFC" stroke="url(#neonBlue192)" stroke-width="1.5" />

    <!-- Left Sprockets -->
    <g fill="#F8FAFC">
      <rect x="62" y="37" width="6" height="8" rx="1.5" />
      <rect x="62" y="49" width="6" height="8" rx="1.5" />
      <rect x="62" y="61" width="6" height="8" rx="1.5" />
      <rect x="62" y="73" width="6" height="8" rx="1.5" />
      <rect x="62" y="85" width="6" height="8" rx="1.5" />
      <rect x="62" y="97" width="6" height="8" rx="1.5" />
      <rect x="62" y="109" width="6" height="8" rx="1.5" />
      <rect x="62" y="121" width="6" height="8" rx="1.5" />
      <rect x="62" y="133" width="6" height="8" rx="1.5" />
      <rect x="62" y="145" width="6" height="8" rx="1.5" />
    </g>

    <!-- Right Sprockets -->
    <g fill="#F8FAFC">
      <rect x="124" y="37" width="6" height="8" rx="1.5" />
      <rect x="124" y="49" width="6" height="8" rx="1.5" />
      <rect x="124" y="61" width="6" height="8" rx="1.5" />
      <rect x="124" y="73" width="6" height="8" rx="1.5" />
      <rect x="124" y="85" width="6" height="8" rx="1.5" />
      <rect x="124" y="97" width="6" height="8" rx="1.5" />
      <rect x="124" y="109" width="6" height="8" rx="1.5" />
      <rect x="124" y="121" width="6" height="8" rx="1.5" />
      <rect x="124" y="133" width="6" height="8" rx="1.5" />
      <rect x="124" y="145" width="6" height="8" rx="1.5" />
    </g>
  </g>

  <!-- Yellow Play Button -->
  <path
    d="M 88 78 C 88 76 90.2 74.8 91.8 75.8 L 111.5 93.8 C 113.2 95 113.2 97.4 111.5 98.6 L 91.8 116.6 C 90.2 117.6 88 116.4 88 114.4 Z"
    fill="url(#playYellow192)"
  />
</svg>
